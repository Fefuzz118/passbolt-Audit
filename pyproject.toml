[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "passbolt-audit"
version = "0.1.0.1"
description = "Audit Passbolt CE passwords for weak, reused, and compromised credentials"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [
    {name = "Your Name", email = "you@example.com"}
]
dependencies = ["zxcvbn"]

[project.optional-dependencies]
dev = ["ruff", "mypy", "hatch"]
test = ["pytest", "pytest-cov", "pytest-mock", "pytest-asyncio", "hypothesis"]
lint = ["ruff", "mypy"]
cli = ["click>=8.0"]
all = ["passbolt-audit[dev,test,lint,cli]"]

[project.scripts]
passbolt-audit = "passbolt_audit.__main__:main"

[project.urls]
Homepage = "https://github.com/<user>/passbolt-audit"
Repository = "https://github.com/<user>/passbolt-audit"
Issues = "https://github.com/<user>/passbolt-audit/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/passbolt_audit"]

[tool.hatch.build.targets.sdist]
include = ["src/passbolt_audit"]

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "ANN", "TCH", "N", "C4", "ARG"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]
"tests/*" = ["ANN", "ARG"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.mypy]
python_version = "3.11"
strict = true
warn_return_any = true
warn_unused_ignores = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --tb=short --cov=src --cov-report=term-missing --cov-fail-under=80"
filterwarnings = ["ignore::DeprecationWarning"]

[tool.coverage.run]
source = ["src"]
branch = true
omit = ["*/__main__.py", "*/cli.py"]

[tool.coverage.report]
exclude = ["tests/*"]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
]